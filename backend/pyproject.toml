[project]
name = "ssh-kms-backend"
version = "0.1.0"
description = "FastAPI backend for SSH KMS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "PyJWT[crypto]>=2.8,<3",
    "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "requests>=2,<3",
]

[project.scripts]
ssh-kms = "ssh_kms.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ssh_kms*"]
