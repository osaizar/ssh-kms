services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command:
      - start-dev
      - --import-realm
      - --hostname=localhost
      - --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm/ssh-kms-realm.json:/opt/keycloak/data/import/ssh-kms-realm.json:ro
      - ./keycloak/themes/ssh-kms:/opt/keycloak/themes/ssh-kms:ro

  ssh-kms:
    build:
      context: .
      args:
        VITE_OIDC_ENABLED: "true"
        VITE_OIDC_AUTHORITY: "http://localhost:8080/realms/ssh-kms"
        VITE_OIDC_CLIENT_ID: "ssh-kms-ui"
    environment:
      SSH_KMS_KEY_FILE: /config/ssh-keys.json
      SSH_KMS_CLIENT_FILE: /app/client/get-ssh-keys.py
      OIDC_ENABLED: "true"
      OIDC_ISSUER: "http://localhost:8080/realms/ssh-kms"
      OIDC_JWKS_URL: "http://keycloak:8080/realms/ssh-kms/protocol/openid-connect/certs"
      OIDC_CLIENT_ID: "ssh-kms-ui"
      OIDC_VIEWER_ROLE: "viewer"
      OIDC_ADMIN_ROLE: "key-admin"
    depends_on:
      - keycloak
    ports:
      - "5000:5000"
    volumes:
      - ${CONFIG_FILE:-./config/ssh-keys.json}:/config/ssh-keys.json:rw
